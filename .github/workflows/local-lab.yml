name: Local AWS simulation

on:
  pull_request:
    paths:
      - "app/**"
      - "infra/environments/local/**"
      - "local/**"
      - "scripts/local-lab.sh"
      - "compose.local.yml"
      - "Dockerfile"
      - ".github/workflows/local-lab.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/environments/local/**"
      - "local/**"
      - "scripts/local-lab.sh"
      - "compose.local.yml"
      - "Dockerfile"
      - ".github/workflows/local-lab.yml"

permissions:
  contents: read

concurrency:
  group: local-aws-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Docker and LocalStack integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"

      - name: Start and test local platform
        run: bash scripts/local-lab.sh up

      - name: Show service logs on failure
        if: failure()
        run: docker compose --project-name aws-production-platform-local --file compose.local.yml logs

      - name: Stop local platform
        if: always()
        run: bash scripts/local-lab.sh down
